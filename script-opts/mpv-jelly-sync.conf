# Copy to ~/.config/mpv/script-opts/mpv-jelly-sync.conf

# Jellyfin server base URL.
# Your password is sent to this URL at login, so use https:// unless the
# connection is on a network you trust.
url=http://jellyfin.example.lan:8096

# The Jellyfin user whose watched state should be updated
username=your-jellyfin-username

# File containing ONLY that user's password (chmod 600 it).
# Alternative: set the JELLYFIN_PASSWORD environment variable instead.
password_file=~/.config/mpv/jellyfin_password

# Translate your local mount paths to the paths Jellyfin itself stores.
# Format: local=>jellyfin, separate multiple pairs with ;
# The result must match the path Jellyfin shows exactly (case-sensitive).
# Example:
# path_map=/mnt/Media/Movies=>/mnt/movies;/mnt/Media/TV Shows=>/mnt/tv
path_map=

# no  = only mark items watched (at EOF or past watched_threshold)
# yes = full sync: start, progress, pause/seek, stop (Jellyfin tracks resume position)
sync_progress=no

# Seconds between progress reports (sync_progress=yes only)
progress_interval=10

# Percent played at which an item counts as watched (sync_progress=no only;
# with sync_progress=yes Jellyfin's own server-side threshold applies)
watched_threshold=90

# Per-request timeout in seconds
request_timeout=5
